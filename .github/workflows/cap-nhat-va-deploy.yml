# Dung lai bao cao HTML tu du lieu trong data/ va deploy len GitHub Pages.
#
# Tai sao khong cao du lieu ngay tai day: vietlott.vn dung Cloudflare, IP datacenter cua
# runner GitHub bi tra ve 403 "cf-mitigated: challenge" (da do thu 14/08/2026). Nen viec cao
# van chay o may ca nhan qua cap-nhat.bat - script do commit data/ roi push, kich hoat workflow nay.
#
# Buoc report khong goi mang, chi doc CSV, nen chay tren runner hoan toan on.
name: Dung bao cao va deploy

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'src/**'
      - '.github/workflows/cap-nhat-va-deploy.yml'
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Dung bao cao tu du lieu da luu
        run: node src/cli.js report

      # Pages phuc vu index.html o goc, con CLI xuat ra reports/vietlott.html.
      - name: Chuan bi thu muc site
        run: |
          mkdir -p site
          cp reports/vietlott.html site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
